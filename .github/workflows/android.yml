name: Android APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Run model tests
        run: npm run test:model

      - name: Build Next.js static export
        run: npm run build

      - name: Add Android platform (if missing)
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      # Иконка и splash из assets/icon.png (сгенерированы из public/icon-512.svg)
      - name: Generate Android icons
        run: npx --yes @capacitor/assets generate --android --assetPath assets
        continue-on-error: true

      # versionCode обязан расти, иначе Android не поставит обновление поверх.
      - name: Set version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          sed -i "s/versionCode [0-9]\+/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"$VERSION\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle

      # Подпись обязательна для обновления поверх: APK, подписанный другим ключом,
      # Android ставить откажется — придётся удалять приложение вместе с данными.
      - name: Configure signing
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "Keystore secret is empty — собираем debug-сборку"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          cat > android/keystore.properties <<EOF
          storeFile=$GITHUB_WORKSPACE/android/app/release.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          cat >> android/app/build.gradle <<'EOF'

          // Подпись релиза (добавляется из CI): параметры читаются из keystore.properties.
          android {
              signingConfigs {
                  release {
                      def props = new Properties()
                      def propsFile = rootProject.file("keystore.properties")
                      if (propsFile.exists()) {
                          props.load(new FileInputStream(propsFile))
                          storeFile file(props['storeFile'])
                          storePassword props['storePassword']
                          keyAlias props['keyAlias']
                          keyPassword props['keyPassword']
                      }
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          EOF
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build APK
        working-directory: android
        run: |
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
            ./gradlew assembleRelease --no-daemon
          else
            ./gradlew assembleDebug --no-daemon
          fi

      - name: Collect APK
        run: |
          mkdir -p artifacts
          VERSION=$(node -p "require('./package.json').version")
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
            cp android/app/build/outputs/apk/release/app-release.apk \
               "artifacts/flashcards-$VERSION-${{ github.run_number }}.apk"
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk \
               "artifacts/flashcards-$VERSION-${{ github.run_number }}-debug.apk"
          fi
          ls -la artifacts

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: flashcards-apk
          path: artifacts/*.apk
          retention-days: 30

      # На тег v* публикуем релиз: оттуда приложение и берёт обновления
      # (плашка «Доступна версия N» в components/UpdateBanner.tsx).
      - name: Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.apk
          generate_release_notes: true
