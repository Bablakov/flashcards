name: Desktop (Windows)

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
  release:
    types: [published]

# Токен сборки по умолчанию только на чтение — для публикации релиза
# нужны права на запись содержимого репозитория.
permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build web bundle
        run: npm run build

      - name: Run model tests
        run: npm run test:model

      # Установщик NSIS: путь установки выбирает пользователь, ярлыки создаются.
      # На тег v* electron-builder публикует релиз — оттуда же приложение берёт
      # обновления через electron-updater.
      - name: Build installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win nsis --publish ${{ startsWith(github.ref, 'refs/tags/v') && 'always' || 'never' }}

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: flashcards-windows
          path: dist-desktop/*.exe
          retention-days: 30
