name: Desktop (Windows)

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
  release:
    types: [published]

# Токен сборки по умолчанию только на чтение — для публикации релиза
# нужны права на запись содержимого репозитория.
permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build web bundle
        run: npm run build

      - name: Run model tests
        run: npm run test:model

      # Установщик NSIS: путь установки выбирает пользователь, ярлыки создаются.
      # Публикацию electron-builder НЕ делает: он создавал собственный черновик
      # релиза, из-за чего .exe и latest.yml не попадали в опубликованный релиз
      # рядом с APK. Файлы выкладываются отдельным шагом ниже.
      - name: Build installer
        run: npx electron-builder --win nsis --publish never

      # latest.yml обязателен: без него автообновление ПК-версии не видит новую сборку.
      - name: Attach installer to release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for i in $(seq 1 40); do
            if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then break; fi
            echo "жду, пока сборка Android создаст релиз ($i)"
            sleep 15
          done
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist-desktop/*.exe dist-desktop/latest.yml --clobber

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: flashcards-windows
          path: dist-desktop/*.exe
          retention-days: 30
