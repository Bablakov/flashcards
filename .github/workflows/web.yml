name: Web (GitHub Pages)

# Сайт https://bablakov.github.io/flashcards/ — версия для iPhone без установки
# (Safari → «На экран „Домой“»). На каждый push в main сборка только проверяется,
# а выкладывается на тег v* — вместе с APK, EXE и IPA той же версии — или вручную.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Две выкладки одновременно не нужны, но и обрывать начатую не стоит.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run model tests
        run: npm run test:model

      # Сборка в подпапке /flashcards и service worker для работы без сети.
      - name: Build site
        run: npm run build:web

      - name: Upload site
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
